name: SCALAR Tagger CI

on:
  push:
    branches: [ master, develop, distilbert ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Pull pre-built image
        run: docker pull sourceslicer/scalar_tagger:latest
      
      - name: Start container
        run: |
          docker run -d -p 8080:8080 sourceslicer/scalar_tagger:latest
      
      - name: Wait for service to start
        run: |
          # Wait for up to 10 minutes for the service to start
          timeout=600
          while [ $timeout -gt 0 ]; do
            if curl -s "http://localhost:8080/cache/numberArray/DECLARATION" > /dev/null; then
              echo "Service is ready"
              break
            fi
            echo "Waiting for service to start... ($timeout seconds remaining)"
            sleep 5
            timeout=$((timeout - 5))
          done
          
          if [ $timeout -le 0 ]; then
            echo "Service failed to start within timeout"
            docker logs $(docker ps -q)
            exit 1
          fi
      
      - name: Test tagger endpoint
        run: |
          response=$(curl -s "http://localhost:8080/cache/numberArray/DECLARATION")
          if [ -z "$response" ]; then
            echo "No response from tagger"
            exit 1
          fi
          echo "Received response: $response"

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Create and activate virtual environment
        run: |
          python -m venv /tmp/tagger
          source /tmp/tagger/bin/activate
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Check version
        run: python main --version

      - name: Unit tests
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Start tagger server
        run: |
          python main --mode run --protocol http &
          
          # Wait for up to 5 minutes for the service to start and load models
          timeout=300
          while [ $timeout -gt 0 ]; do
            if curl -s "http://localhost:8080/numberArray/DECLARATION" > /dev/null; then
              echo "Service is ready"
              break
            fi
            echo "Waiting for service to start... ($timeout seconds remaining)"
            sleep 10
            timeout=$((timeout - 10))
          done
          
          if [ $timeout -le 0 ]; then
            echo "Service failed to start within timeout"
            # Print logs or debug information
            cat logs/*.log 2>/dev/null || true
            exit 1
          fi
      
      - name: Test tagger endpoint
        run: |
          response=$(curl -s "http://localhost:8080/numberArray/DECLARATION")
          if [ -z "$response" ]; then
            echo "No response from tagger"
            exit 1
          fi
          echo "Received response: $response"

      - name: Test batch endpoints
        run: |
          curl -sf "http://localhost:8080/info"
          curl -sf -X POST "http://localhost:8080/tag" -H "Content-Type: application/json" \
            -d '{"id": 1, "identifiers": [{"key": "a", "name": "getUserToken", "context": "FUNCTION"}]}' \
            | python -c "import json, sys; r = json.load(sys.stdin); assert r['results'][0]['tokens'][0]['text'] == 'get', r; print(r)"

      - name: Test stdio mode
        run: |
          echo '{"id": 1, "identifiers": [{"key": "a", "name": "getUserToken", "context": "FUNCTION"}]}' \
            | python main --mode serve --stdio --device cpu 2>/dev/null \
            | python -c "import json, sys; lines = [json.loads(l) for l in sys.stdin]; assert lines[0]['ready'] and len(lines) == 2, lines; print(lines[1])"
